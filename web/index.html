<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Multi-Agent Code Review</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Multi-Agent Code Review</h1>
        <p class="subtitle">Quality • Security • Performance • Refactor</p>
      </div>
      <div class="actions">
        <button class="btn ghost" id="btnExample">Örnek Kod</button>
        <button class="btn ghost" id="btnClear">Temizle</button>
        <a class="btn ghost" href="/docs" target="_blank" rel="noreferrer">API /docs</a>
      </div>
    </header>

    <main class="grid">
      <section class="panel">
        <div class="panelHead">
          <h2>Kodu Yapıştır</h2>
          <div class="hint">Python kodunu buraya yapıştırıp analiz et.</div>
        </div>
        
        <textarea id="code" spellcheck="false" placeholder="def hello():
    print('Hi')"></textarea>

        <div class="bar">
          <div class="status" id="status">Hazır</div>
          <div class="barRight">
            <label class="toggle">
              <input type="checkbox" id="pretty" checked />
              <span>Sonucu düzenli göster</span>
            </label>
            <button class="btn primary" id="btnAnalyze">Analyze</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panelHead">
          <h2>Sonuçlar</h2>
          <div class="hint" id="summary">Henüz analiz yapılmadı.</div>
        </div>

        <div id="results" class="results empty">
          <div class="emptyState">
            <div class="emptyTitle">Analiz çıktısı burada görünecek</div>
            <div class="emptyText">Bir kod ekleyip <b>Analyze</b>’a bas.</div>
          </div>
        </div>

        <div class="footerRow">
          <button class="btn ghost" id="btnCopy" disabled>JSON Kopyala</button>
          <span class="muted" id="meta"></span>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
